[package]
name = "bep-analyzer-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
console_error_panic_hook = "0.1.7"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
worker = "0.8"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
